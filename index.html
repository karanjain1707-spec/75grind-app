<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text x=%2250%22 y=%2262%22 font-size=%2242%22 text-anchor=%22middle%22 fill=%22%23fbbf24%22 font-family=%22sans-serif%22 font-weight=%22900%22>75</text></svg>" />
    <title>75 Grind</title>
    <!--
      Tailwind is loaded via CDN rather than a PostCSS build step, to keep
      this project simple to run/deploy. Swap in a real Tailwind build
      (postcss + tailwind.config.js) later if you want smaller CSS output.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { background: #020617; min-height: 100vh; margin: 0; }

      /* iOS Safari renders the native date/time value centered with its own
         intrinsic width, which overflows custom-styled inputs (background,
         border, rounded corners) on narrow screens. Force it to sit flush
         left and shrink to fit instead of poking out of the box. */
      input[type="date"],
      input[type="time"] {
        -webkit-appearance: none;
        appearance: none;
        min-width: 0;
        box-sizing: border-box;
      }
      input[type="date"]::-webkit-date-and-time-value {
        text-align: left;
        min-width: 0;
      }
      input[type="date"]::-webkit-datetime-edit,
      input[type="time"]::-webkit-datetime-edit {
        max-width: 100%;
        overflow: hidden;
      }

      /* Confetti burst on day-complete celebration. */
      @keyframes confetti-fall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(220px) rotate(360deg); opacity: 0; }
      }
      .confetti-piece {
        animation-name: confetti-fall;
        animation-timing-function: ease-in;
        animation-fill-mode: forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
